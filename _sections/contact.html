---
title: 联系我
icon: fa-envelope
order: 4
---

<p>如果您有任何建议、合作意向或者只是想打个招呼，欢迎通过下方的表单直接给我发送邮件。
我会尽快查看并给您回复！</p>

<form method="post" action="https://formspree.io/{{ site.email }}">
  <div class="row">
    <div class="6u 12u$(mobile)">
      <input type="text" name="name" placeholder="您的姓名" />
    </div>
    <div class="6u$ 12u$(mobile)">
      <input type="text" name="email" placeholder="您的邮箱地址" />
    </div>
    <div class="12u$">
      <textarea name="message" placeholder="请在这里输入您想说的话..." rows="6"></textarea>
    </div>
    <div class="12u$">
      <input type="submit" value="发送消息" class="special" />
    </div>
  </div>
</form>
